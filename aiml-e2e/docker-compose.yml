# Northwind Finance - API + Prometheus + Grafana (educational demo, synthetic data).
#   make docker-build && make up      ->  API :8000, Prometheus :9090, Grafana :3000
#   make logs / make down
name: northwind-loans

services:
  api:
    image: iomega/northwind-loans-api:0.1.0
    env_file: .env                    # MODEL_SIGNING_KEY, LOG_LEVEL, ...
    environment:
      API_HOST: 0.0.0.0
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - ./logs:/app/logs              # predictions.jsonl lands on the host
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle         # allows: curl -X POST localhost:9090/-/reload
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro   # prometheus.yml + alerts.yml
      - prometheus-data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
