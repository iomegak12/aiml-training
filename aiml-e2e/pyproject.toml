[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northwind-loans"
version = "0.1.0"
description = "Northwind Finance - predict the maximum loan offer (INR). Educational demo on synthetic data; NOT for real credit decisions."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ramkumar" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "pyarrow==18.1.0",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.4",
    "prometheus-client==0.21.1",
    "python-json-logger==3.2.1",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# project-local temp dir: avoids Windows permission errors on %TEMP%\pytest-of-<user>\pytest-current
addopts = "--basetemp=.pytest_tmp"
filterwarnings = [
    "error",  # treat every warning as a test failure ...
    # ... except this third-party one: starlette 0.41.3 (pinned via fastapi) uses an
    # alias deprecated in newer anyio
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
